<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="description" content="ギルド用カウントダウンPWA"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>Guild Countdown</title></head><body><main class="app"><header class="hero"><div class="badge">GUILD COUNTDOWN</div><h1>Guild Countdown</h1><p>規定の間隔で1ずつ減算するカウントダウン</p></header><section class="card countdown-card"><div class="event-title">残りカウント</div><div class="countdown single"><strong id="count">---</strong></div><div class="status" id="status">パターンを選択してください</div></section><section class="card settings"><h2>カウントダウンパターン</h2><div class="pattern-grid"><button class="pattern" data-start="675" data-interval="4000"><b>675</b><span>4秒ごとに −1</span></button><button class="pattern" data-start="900" data-interval="3000"><b>900</b><span>3秒ごとに −1</span></button><button class="pattern" data-start="1350" data-interval="2000"><b>1350</b><span>2秒ごとに −1</span></button></div><div class="actions"><button class="primary" id="startBtn">開始</button><button class="secondary" id="pauseBtn">一時停止</button><button class="secondary" id="resetBtn">リセット</button></div></section><footer>Guild Countdown · PWA</footer></main><script src="app.js"></script></body></html>
