<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="description" content="毎日21:00と22:00に開始するギルドカウントダウンPWA"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>Guild Countdown</title></head><body><div id="lockScreen" class="lock-screen"><section class="lock-card"><h1>🔒 Guild Countdown</h1><p>閲覧するにはパスワードを入力してください。</p><form id="passwordForm"><input id="passwordInput" type="password" autocomplete="current-password" placeholder="パスワード" autofocus><button class="primary" type="submit">ロック解除</button><p id="passwordError" class="password-error"></p></form><button id="adminButton" class="admin-link" type="button">⚙️ パスワード管理</button></section></div><div id="adminScreen" class="lock-screen hidden"><section class="lock-card"><h1>⚙️ パスワード管理</h1><div id="changeAuth"><p>第1段階：パスワード変更用パスワードを入力してください。</p><input id="changeAuthPassword" type="password" autocomplete="off" placeholder="パスワード変更用パスワード"><button id="changeAuthButton" class="primary" type="button">次へ</button><p id="changeAuthError" class="password-error"></p></div><div id="adminPanel" class="hidden"><p>第2段階：パスワード変更が許可されました。</p><p>現在の有効期限：<strong id="expiryStatus">—</strong></p><label>新しいログインパスワード<input id="newPassword" type="password" autocomplete="new-password" placeholder="4文字以上"></label><label>新しいパスワード（確認）<input id="newPasswordConfirm" type="password" autocomplete="new-password" placeholder="もう一度入力"></label><label>有効期間（日）<input id="passwordDays" type="number" min="0" value="30"><small>0にすると無期限</small></label><button id="changePasswordButton" class="primary" type="button">パスワードを変更</button><p id="adminError" class="password-error"></p></div><button id="adminClose" class="secondary" type="button">閉じる</button></section></div><main id="appContent" class="app hidden"><header class="hero"><div class="badge">GUILD COUNTDOWN</div><h1>Guild Countdown</h1><p>毎日21:00・22:00に自動開始</p><div class="header-actions"><button id="adminAppButton" class="secondary" type="button">⚙️ パスワード管理</button><button id="lockButton" class="secondary" type="button">🔒 ロック</button></div></header><section class="card countdown-card"><div class="event-title" id="session">次回セッション</div><div class="countdown single"><strong id="count">---</strong></div><div class="status" id="status">待機中</div></section><section class="card settings"><h2>カウントダウンパターン</h2><div class="pattern-grid"><button class="pattern" data-start="675" data-interval="4000"><b>675</b><span>4秒ごとに −1</span></button><button class="pattern" data-start="900" data-interval="3000"><b>900</b><span>3秒ごとに −1</span></button><button class="pattern" data-start="1350" data-interval="2000"><b>1350</b><span>2秒ごとに −1</span></button></div><div class="actions"><button class="primary" id="startBtn">手動開始</button><button class="secondary" id="pauseBtn">一時停止</button><button class="secondary" id="resetBtn">リセット</button></div></section><section class="card"><h2>自動開始時刻</h2><div class="schedule"><span>毎日</span><b>21:00</b><span>・</span><b>22:00</b><span>に開始</span></div></section><footer>Guild Countdown · PWA · 日本時間</footer></main><script src="app.js"></script></body></html>
